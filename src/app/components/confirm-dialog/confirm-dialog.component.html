<h2 mat-dialog-title>Delete loan record?</h2>
<mat-dialog-content>
  <p class="text-text-base mb-2">
    This will permanently remove <strong>{{ data.loan.id }}</strong> from the portfolio.
  </p>
  <p class="text-text-base mb-0">This action cannot be undone.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="dialogRef.close(false)">Cancel</button>
  <button mat-flat-button color="warn" (click)="dialogRef.close(true)">Delete</button>
</mat-dialog-actions>
